name: ps4-homebrew-libs

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}-${{ github.event_name  }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:

    - name: Checkout
      uses: actions/checkout@v3

    - name: Setup
      run: |
        sudo apt update
        sudo apt install cmake pkg-config meson clang-20 lld-20
        sudo apt install llvm-20-dev libclang-20-dev libclang-cpp20-dev
        sudo apt install libclc-20-dev libllvmspirvlib-20-dev
        sudo apt install build-essential autoconf libtool yasm nasm bison flex
        sudo apt install smpq gperf pkgconf libarchive-tools autopoint po4a git curl doxygen
        sudo apt install makepkg pacman-package-manager python3-mako python3-glad
        sudo apt install spirv-tools glslang-tools python3-packaging
        sudo python3 -m pip install --break-system-packages 'meson>=1.4.0'

    - name: Build artifacts
      run: bash ci-libs.sh

    - name: Package artifacts
      run: tar -czf ps4-homebrew-dev.tar.gz -C / opt/ps4-homebrew-sdk

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: artifacts
        path: ./ps4-homebrew-dev.tar.gz
        if-no-files-found: error

  release:
    needs: build
    permissions:
      contents: write

    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: artifacts
          path: .

      - name: Create GitHub Release (pre-release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          prerelease: true
          files: ps4-homebrew-dev.tar.gz
